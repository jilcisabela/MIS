<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MIS — Management Information System</title>
<meta name="theme-color" content="#0f3b36">
<style>
:root{
  --pine:#0f3b36;--pine2:#1a5a50;--leaf:#2f7d6d;--mint:#dcebe5;--mint2:#eef5f2;--paper:#f2f3ee;
  --gold:#e8a920;--gold2:#fbefc9;--ink:#16201e;--muted:#5b6965;--line:#dde3dd;--card:#fff;
  --good:#1f7a5a;--bad:#c0392b;--warn:#b97a0b;
  --forest:var(--pine);--olive:var(--leaf);--sage:var(--mint);--sage2:var(--mint2);
  --disp:Charter,"Bitstream Charter","Sitka Text",Cambria,Georgia,serif;
  --body:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{font-family:var(--body);color:var(--ink);font-size:14px;line-height:1.45;background:var(--paper);-webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--leaf);outline-offset:2px}

.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
.side{position:sticky;top:0;height:100vh;padding:20px 12px;display:flex;flex-direction:column;gap:4px;background:var(--pine);color:#cfe3dd}
.brand{display:flex;align-items:center;gap:11px;padding:2px 8px 22px}
.mark{width:38px;height:38px;border-radius:10px;background:var(--gold);color:var(--pine);display:grid;place-items:center;flex:none}
.mark.custom{background:#fff;padding:3px;width:44px;height:44px}
.mark img{width:100%;height:100%;object-fit:contain;border-radius:7px;display:block}
.mark svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round}
.brand b{font-family:var(--disp);font-weight:700;font-size:17px;display:block;line-height:1.15;color:#fff;overflow-wrap:anywhere}
.brand small{opacity:.65;font-size:11px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:8px;font-size:14px;font-weight:600;color:#b4cdc5;transition:background .15s,color .15s}
.nav button:hover{background:rgba(255,255,255,.07);color:#fff}
.nav button.on{background:rgba(255,255,255,.12);color:#fff;box-shadow:inset 3px 0 0 var(--gold)}
.nav button:focus-visible{outline:2px solid var(--gold)}
.nav .ic{width:22px;height:22px;display:grid;place-items:center;flex:none}
.nav .ic svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.side-foot{margin-top:auto;font-size:11px;line-height:1.5;opacity:.7;padding:12px 10px;border-top:1px solid rgba(255,255,255,.14)}
main{padding:18px 30px 100px;min-width:0;max-width:1280px}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:20px}
.top .sp{flex:1}
.church{font-weight:700;font-size:14px;color:var(--muted);display:flex;align-items:center;gap:8px}
.save{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:600;color:var(--muted);padding:6px 4px}
.save .dot{width:8px;height:8px;border-radius:50%;background:var(--good)}
.save.saving .dot{background:var(--warn);animation:blink .6s infinite alternate}
.save.err .dot{background:var(--bad)}
@keyframes blink{to{opacity:.3}}

.btn{cursor:pointer;border:1px solid var(--pine);display:inline-flex;align-items:center;gap:7px;justify-content:center;padding:9px 15px;border-radius:8px;font-weight:650;font-size:13.5px;color:#fff;white-space:nowrap;background:var(--pine);transition:background .15s,border-color .15s}
.btn:hover{background:var(--pine2);border-color:var(--pine2)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#2a1f03}
.btn.gold:hover{background:#f1b93c;border-color:#f1b93c}
.btn.danger{background:var(--bad);border-color:var(--bad)}
.btn.danger:hover{background:#a52f22;border-color:#a52f22}
.btn.ghost{background:#fff;color:var(--pine);border-color:#c9d3cc}
.btn.ghost:hover{background:var(--mint2);border-color:var(--leaf)}
.btn.glass{background:transparent;border-color:rgba(255,255,255,.45);color:#fff}
.btn.glass:hover{background:rgba(255,255,255,.12)}
.btn.sm{padding:6px 10px;font-size:12.5px}
.icon-btn{cursor:pointer;border:1px solid var(--line);background:#fff;border-radius:8px;width:34px;height:34px;display:inline-grid;place-items:center;font-size:14px;transition:background .15s,border-color .15s;flex:none}
.icon-btn:hover{background:var(--mint2);border-color:var(--leaf)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;position:relative;margin-bottom:16px}
.card h4{font-size:15px;font-weight:700;color:var(--pine);margin-bottom:12px}
.ch{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.ch h4{margin:0}
.muted{color:var(--muted)}.sm{font-size:12px}
.phead{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;margin:4px 0 20px}
.phead h2{font-family:var(--disp);font-size:30px;font-weight:700;color:var(--pine);line-height:1.1;letter-spacing:-.01em}
.phead p{color:var(--muted);margin-top:5px}
.pact{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:16px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:16px}
.grid2>.card,.grid3>.card,.grid4>.card{margin-bottom:0}
.empty{text-align:center;padding:48px 20px;color:var(--muted);border-style:dashed}
.empty .ei{font-size:38px;margin-bottom:8px;display:inline-block;filter:grayscale(.3)}
.empty h3{color:var(--pine);font-size:18px;margin-bottom:6px;font-family:var(--disp)}

.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fgrid.three{grid-template-columns:1fr 1fr 1fr}
.f{display:flex;flex-direction:column;gap:5px;font-size:12.5px;font-weight:600;color:var(--muted)}
.f.full{grid-column:1/-1}
.in{width:100%;padding:9px 11px;border-radius:8px;border:1px solid #cdd6cf;background:#fff;font:inherit;font-size:14px;color:var(--ink);transition:border-color .15s,box-shadow .15s}
.in:focus{border-color:var(--leaf);box-shadow:0 0 0 3px rgba(47,125,109,.18);outline:none}
textarea.in{resize:vertical;line-height:1.5}
.search{position:relative;flex:1;min-width:200px;max-width:380px}
.search .in{padding-left:36px}
.search span{position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:13px}
.hint{font-size:12px;color:var(--muted);margin-top:10px;line-height:1.5}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{cursor:pointer;border:1px solid #cdd6cf;background:#fff;padding:6px 13px;border-radius:99px;font-weight:600;color:var(--pine);font-size:12.5px;transition:background .15s}
.seg button:hover{background:var(--mint2)}
.seg button.on{background:var(--pine);color:#fff;border-color:var(--pine)}

.tbl-wrap{overflow-x:auto;border-radius:10px;border:1px solid var(--line);background:#fff}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{background:var(--mint2);color:var(--pine);font-size:12px;font-weight:700;text-align:left;padding:10px;white-space:nowrap;border-bottom:1px solid var(--line)}
.tbl td{padding:10px;border-bottom:1px solid #edf1ed;vertical-align:middle;white-space:nowrap}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr:hover{background:#f8fbf9}
.tbl td small{display:block;color:var(--muted);font-size:11px}
.tbl .r{text-align:right}
.tbl tfoot td{font-weight:800;background:var(--mint2);border-top:2px solid var(--line)}
.num{font-family:var(--disp);font-weight:700;font-size:15px}

.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:99px;font-size:11.5px;font-weight:650;white-space:nowrap;background:var(--mint);color:var(--pine)}
.chip.Active{background:#d3ece0;color:#14583f}.chip.Inactive{background:#ebebe6;color:#66675f}
.chip.Visitor{background:#e1ebf6;color:#2b5a8a}.chip.NewBeliever,.chip.New{background:var(--gold2);color:#7a5608}
.chip.info{background:var(--mint);color:var(--pine)}.chip.bad{background:#f8e1dd;color:#a3301f}.chip.gold{background:var(--gold2);color:#7a5608}
.av{border-radius:50%;display:inline-grid;place-items:center;font-weight:700;color:#fff;flex:none;overflow:hidden;box-shadow:0 0 0 2px #fff}
.av img{width:100%;height:100%;object-fit:cover;display:block}

/* dashboard header */
.hero{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap;border-radius:16px;padding:34px 36px;margin-bottom:16px;color:#fff;background:var(--pine)}
.hero-l{max-width:640px}
.hero h1{font-family:var(--disp);font-weight:700;font-size:clamp(30px,4vw,46px);line-height:1.08;letter-spacing:-.015em;color:#fff}
.hero .greet{margin:12px 0 22px;color:#bfd8d0;font-size:15px;line-height:1.6;max-width:56ch}
.hero .greet b{color:#fff}
.hero-btns{display:flex;gap:10px;flex-wrap:wrap}
.faces{display:flex;align-items:center;padding-left:10px}
.faces .av{width:46px;height:46px;margin-left:-6px;box-shadow:0 0 0 3px var(--pine)}
.faces .more{width:46px;height:46px;margin-left:-6px;border-radius:50%;display:grid;place-items:center;background:var(--gold);color:var(--pine);font-weight:800;font-size:13px;box-shadow:0 0 0 3px var(--pine)}

/* stats */
.stat{display:block;padding:16px 18px;border-top:3px solid var(--leaf)}
.stat.c2{border-top-color:var(--gold)}.stat.c3{border-top-color:var(--pine2)}.stat.c4{border-top-color:var(--bad)}
.sic{display:none}
.sl{font-size:12.5px;color:var(--muted);font-weight:600;margin-bottom:4px}
.sv{font-family:var(--disp);font-size:32px;font-weight:700;color:var(--pine);line-height:1.1}
.sv small{font-size:14px;color:var(--muted);font-family:var(--body);font-weight:500}
.grid-dash{display:grid;grid-template-columns:1.55fr 1fr;gap:16px}
.chart{width:100%;height:auto;overflow:visible}
.chart .gl{stroke:#e6ebe6}.chart .cl{font-size:11px;fill:#6b7773}.chart .cv{font-size:10px;fill:#2a3835;font-weight:700}
.bar{transform-box:fill-box;transform-origin:bottom;animation:growY .7s ease-out both}
@keyframes growY{from{transform:scaleY(0)}}
.line{stroke-dasharray:2000;stroke-dashoffset:2000;animation:draw 1.6s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.li{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #edf1ed}
.li:last-child{border:0}
.li .grow{flex:1;min-width:0}
.li .grow b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .grow small{color:var(--muted);font-size:11.5px}
.hbar,.prog{height:7px;border-radius:9px;background:#e6ede8;overflow:hidden}
.hbar{margin-top:5px}
.hbar i,.prog i{display:block;height:100%;border-radius:9px;background:var(--leaf);animation:growW 1s ease-out}
@keyframes growW{from{width:0}}

/* members */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.mcard{margin:0;padding:14px;cursor:pointer;display:grid;grid-template-columns:56px 1fr;column-gap:12px;align-items:center;transition:border-color .15s,background .15s}
.mcard:hover{border-color:var(--leaf);background:#fbfdfc}
.mcard>*:not(.av){grid-column:2;min-width:0}
.mcard .av{grid-column:1;grid-row:1/span 4;width:56px!important;height:56px!important;font-size:18px!important}
.mcard h3{font-size:15px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mcard p{font-size:12px;color:var(--muted)}
.mcard .row{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.mini-dots{display:flex;gap:3px;margin-top:8px}
.mini-dots i{width:9px;height:9px;border-radius:2px;background:#dfe6e0}
.mini-dots i.p{background:var(--leaf)}.mini-dots i.a{background:#e3978d}
.gcard{margin:0;padding:0;overflow:hidden}
.gcard .gt{padding:18px;color:#fff;position:relative;background:var(--gc,var(--pine2))}
.gcard .gt h3{font-family:var(--disp);font-size:21px;padding-right:44px}
.gcard .gt p{opacity:.88;font-size:12.5px;margin-top:3px}
.gcard .gi{position:absolute;right:14px;top:12px;font-size:28px}
.gcard .gb{padding:14px 18px 16px}
.stack{display:flex;margin:4px 0 10px}
.stack .av{width:30px!important;height:30px!important;font-size:11px!important;margin-left:-5px}
.stack .av:first-child{margin-left:0}
.kv{display:flex;justify-content:space-between;gap:12px;padding:6px 0;font-size:12.5px;border-bottom:1px solid #edf1ed}
.kv:last-of-type{border:0}
.acts{display:flex;gap:6px;align-items:center;margin-top:12px;flex-wrap:wrap}

/* profile */
.prof{display:grid;grid-template-columns:300px 1fr;gap:16px}
.pcard{text-align:center;padding:24px 18px}
.pcard .av{width:112px!important;height:112px!important;font-size:34px!important;margin-bottom:12px}
.pcard h2{font-family:var(--disp);font-size:24px;color:var(--pine)}
.tl{position:relative;padding-left:24px}
.tl::before{content:"";position:absolute;left:8px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tl div{position:relative;padding:6px 0 12px}
.tl div::before{content:"";position:absolute;left:-21px;top:9px;width:12px;height:12px;border-radius:50%;background:var(--leaf);border:3px solid #fff;box-shadow:0 0 0 1px var(--leaf)}
.tl div.no::before{background:#fff;box-shadow:0 0 0 1px #b9c6bf}
.tl b{display:block;font-size:13px}.tl small{color:var(--muted)}
.dots{display:flex;gap:5px;flex-wrap:wrap}
.dots span{width:30px;height:30px;border-radius:6px;display:grid;place-items:center;font-size:10px;font-weight:700;color:#fff}
.dots .p{background:var(--leaf)}.dots .a{background:#d9766b}

/* records */
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.rcard{margin:0}
.rtop{display:flex;gap:12px;align-items:center;margin-bottom:12px}
.cal{width:52px;height:56px;border-radius:8px;background:#fff;border:1px solid var(--line);text-align:center;overflow:hidden;flex:none}
.cal b{display:block;background:var(--pine);color:#fff;font-size:10.5px;padding:3px 0;letter-spacing:.04em}
.cal span{font-family:var(--disp);font-size:22px;font-weight:700;color:var(--pine);line-height:32px}
.rtop h3{font-size:15px;color:var(--ink)}
.attgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}
.att{cursor:pointer;display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;border:1px solid var(--line);background:#fff;text-align:left;position:relative;transition:border-color .15s,background .15s}
.att:hover{border-color:#b5c5bc}
.att .av{width:36px!important;height:36px!important;font-size:12px!important}
.att>span:not(.av){font-weight:600;font-size:13px;line-height:1.2;flex:1;min-width:0}
.att>span:not(.av) small{display:block;font-weight:500;color:var(--muted);font-size:11px}
.att .ck{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:#fff;border:1.5px solid #c2cfc8;color:transparent;font-style:normal;font-weight:900;font-size:12px;transition:background .2s,color .2s}
.att.on{border-color:var(--leaf);background:var(--mint2)}
.att.on .ck{background:var(--leaf);border-color:var(--leaf);color:#fff}
.bigout{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.bigout div{background:var(--mint2);color:var(--pine);border:1px solid var(--mint);border-radius:10px;padding:12px 14px}
.bigout small{color:var(--muted);font-size:12px}
.bigout b{display:block;font-family:var(--disp);font-size:26px}

/* care */
.pr{margin:0;padding:16px;border-left:4px solid var(--gold)}
.pr.answered{border-left-color:var(--good)}
.pr p{line-height:1.55;margin:10px 0;font-size:13.5px}
.bday{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;background:var(--gold2);margin-bottom:8px}
.bday .av{width:40px!important;height:40px!important;font-size:13px!important}
.bday .d{font-family:var(--disp);font-weight:700;color:#7a5608;text-align:center;line-height:1;min-width:44px;font-size:20px}
.bday .d small{display:block;font-family:var(--body);font-size:10px;font-weight:600;margin-top:2px}
.task{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #edf1ed}
.task.done b{text-decoration:line-through;opacity:.5}
.cbx{width:22px;height:22px;border-radius:6px;border:1.5px solid #a9b9b0;display:grid;place-items:center;cursor:pointer;background:#fff;color:transparent;font-weight:900;font-size:12px;flex:none;transition:background .2s}
.task.done .cbx{background:var(--leaf);border-color:var(--leaf);color:#fff}

/* modal / toast */
#modal{position:fixed;inset:0;z-index:100;display:none;place-items:center;padding:14px}
#modal.open{display:grid}
.mback{position:absolute;inset:0;background:rgba(14,28,25,.5)}
.mbox{position:relative;width:min(580px,100%);max-height:92vh;display:flex;flex-direction:column;background:#fff;border-radius:14px;box-shadow:0 24px 60px -20px rgba(0,0,0,.45);animation:pop .22s ease-out}
.mbox.wide{width:min(820px,100%)}
@keyframes pop{from{transform:translateY(14px);opacity:0}}
.mhead{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line)}
.mhead h3{font-size:18px;color:var(--pine);font-family:var(--disp)}
.mbody{padding:20px;overflow:auto}
.mfoot{display:flex;gap:8px;justify-content:flex-end;padding:14px 20px;border-top:1px solid var(--line);flex-wrap:wrap;background:#fafbf9;border-radius:0 0 14px 14px}
.photo-pick{display:flex;align-items:center;gap:14px;grid-column:1/-1}
.photo-pick .av{width:72px!important;height:72px!important;font-size:22px!important}
#toasts{position:fixed;right:18px;bottom:18px;z-index:200;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--pine);color:#fff;padding:12px 16px;border-radius:10px;font-weight:600;font-size:13px;box-shadow:0 14px 30px -12px rgba(0,0,0,.5);animation:tin .25s ease-out;max-width:340px}
.toast.good{background:var(--pine)}.toast.bad{background:var(--bad)}
.toast.out{opacity:0;transform:translateX(30px);transition:.35s}
@keyframes tin{from{opacity:0;transform:translateY(12px)}}
.burst{position:fixed;z-index:300;pointer-events:none;font-size:20px}
#view.enter{animation:enter .25s ease-out}
@keyframes enter{from{opacity:0;transform:translateY(6px)}}
#printArea{display:none}
.doc{font-family:var(--body);color:#111;background:#fff;max-width:780px;margin:0 auto}
.doc-h{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 20px;background:#0f3b36;color:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact;border-radius:6px}
.doc-h h1{font-family:var(--disp);font-size:21px}
.doc-h p{font-size:11.5px;opacity:.85}
.doc table{width:100%;border-collapse:collapse;font-size:12px;margin-top:12px}
.doc th,.doc td{border:1px solid #bbb;padding:7px 6px;text-align:left}
.doc th{background:#eef5f2;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.doc .sec{margin-top:14px;font-size:12.5px;line-height:1.6}
.doc .sec h3{font-size:13px;color:#0f3b36;border-bottom:2px solid #0f3b36;margin-bottom:6px;padding-bottom:3px}

@media (max-width:1100px){.grid4{grid-template-columns:1fr 1fr}.grid3{grid-template-columns:1fr 1fr}.grid-dash{grid-template-columns:1fr}.prof{grid-template-columns:1fr}}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;left:0;right:0;bottom:0;top:auto;height:auto;flex-direction:row;padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:60;box-shadow:0 -6px 20px -12px rgba(0,0,0,.5)}
  .brand,.side-foot{display:none}
  .nav{flex-direction:row;justify-content:space-around;width:100%}
  .nav button{flex-direction:column;gap:2px;font-size:10px;padding:6px 4px;text-align:center;flex:1;justify-content:center;align-items:center}
  .nav button.on{box-shadow:inset 0 3px 0 var(--gold)}
  .nav .lbl-l{display:none}
  main{padding:12px 14px 100px}
  .hero{padding:24px 22px}
  .grid2,.grid3{grid-template-columns:1fr}
  .bigout{grid-template-columns:1fr 1fr}
}

    <div class="pact"><button class="btn" data-act="ssFetch">Fetch from Google Sheet</button><button class="btn ghost" data-act="ssFile">Upload CSV</button><button class="btn ghost" data-act="ssCompare">Compare Sheet vs CSV</button><button class="btn ghost" data-act="ssInbox">Scanned inbox (${ssPend()})</button><button class="btn ghost" data-act="ssTemplate">Download CSV format</button></div>

function memberChurchNow(){const me=authMe(),sc=state.ui.mScope||{};if(me&&me.ch&&['church','user','district'].includes(me.role))return me.ch;if(me&&me.role!=='church'&&me.role!=='user'&&sc.ch)return sc.ch;return state.settings.church||''}
function orgOfChurch(c){if(!c)return{};for(const r of orgData())for(const p of r.p||[])for(const d of p.d||[])if((d.c||[]).includes(c))return{reg:r.n,prov:p.n,dist:d.n};return{}}
/* Scope ng Members: District \u2192 piliin ang Church; Province \u2192 District + Church; Region \u2192 Province + District + Church */
const memScopeNeeds=()=>{const me=authMe();return !!me&&isMgrRole(me.role)};
function memScopeBarHTML(){const me=authMe();if(!me||!(me.role==='superadmin'||memScopeNeeds()))return'';
  if(!orgData().length)return memScopeNeeds()?'<span class="muted sm">Walang naka-set na Organization (Settings)</span>':'';
  return `<div class="mscope" style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">${SCOPE_KEYS.map(k=>`<label class="f" style="margin:0"><select class="in" id="ms_${k}" onchange="mScopeChange()"></select></label>`).join('')}</div>`}
const memScopeLevels=me=>me.role==='superadmin'?SCOPE_KEYS:me.role==='regional'?['prov','dist','ch']:me.role==='provincial'?['dist','ch']:['ch'];
function mScopeChange(){orgCascade('ms');const v={};SCOPE_KEYS.forEach(k=>{const e=document.getElementById('ms_'+k);v[k]=e?e.value:''});state.ui.mScope=v;save();refreshMembers()}
function refreshMembers(){const el=$('#mlist');if(!el)return;const u=state.ui,q=(u.search||'').trim().toLowerCase();
  const _me=authMe(),_sc=u.mScope||{};if(document.getElementById('ms_ch')&&_me)orgInit('ms',{vals:_sc,fixed:orgFixed(_me),levels:memScopeLevels(_me),hideFixed:true,phs:{reg:'\u2014 Choose region \u2014',prov:'\u2014 Choose province \u2014',dist:'\u2014 Choose district \u2014',ch:'\u2014 Choose church \u2014'}});
  if(memScopeNeeds()&&orgData().length&&!_sc.ch){el.innerHTML='<div class="card" style="padding:18px"><b>Pumili ng church</b><p class="hint" style="margin:6px 0 0">Piliin ang church sa dropdown sa itaas para ma-generate ang listahan ng members nito.</p></div>';return}
  const base=state.members.filter(m=>(u.mStatus==='All'||m.status===u.mStatus)&&(u.mGroup==='All'||(u.mGroup==='none'?!m.groupId:m.groupId===u.mGroup))&&(!(_me&&(memScopeNeeds()||_me.role==='superadmin'))||!_sc.ch||m.church===_sc.ch)).sort((a,b)=>fullName(a).localeCompare(fullName(b)));
  /* una: pangalan / code / nickname lang. Pangalawa: LGL, tribe, LLT, phone, email, address (may nakasulat na dahilan) */
  const nameHit=m=>[longName(m),fullName(m),m.code,m.nick].join(' ').toLowerCase().includes(q);
  const whyOf=m=>{const f=[['LGL',m.lgLeader],['Tribe',m.tribe],['LLT',m.llt],['Phone',m.phone],['Email',m.email],['Address',[m.purok,m.barangay,m.city,m.province,m.address].join(' ')]].find(([,v])=>String(v||'').toLowerCase().includes(q));return f?f[0]+': '+String(f[1]).trim():''};
  const L1=q?base.filter(nameHit):base,L2=q?base.filter(m=>!nameHit(m)&&whyOf(m)):[];
  const card=(m,why)=>{const g=groupById(m.groupId),rs=memberRecs(m).slice(0,8).reverse();return `<div class="card mcard tilt" data-tilt="10" data-act="openMember" data-id="${m.id}">${avatar(m,70)}<button class="icon-btn qrb" data-act="qrMember" data-id="${m.id}" title="QR code" aria-label="QR code ni ${esc(fullName(m))}">${QRI}</button><button class="icon-btn qrb hsb" data-act="memHist" data-id="${m.id}" title="View History" aria-label="View History ni ${esc(fullName(m))}">🕘</button><h3>${esc(fullName(m))}</h3><p>${esc(m.code||'')}${m.tribe?' · '+esc(m.tribe):''}${memIncomplete(m)?' · <span style="color:var(--warn);font-weight:700">kulang ang detalye</span>':''}</p>${why?`<p class="muted sm" style="margin:2px 0 4px;color:var(--warn)">${esc(why)}</p>`:''}<div class="row">${stChip(m.status)}${state.settings.ladder.length?`<span class="chip info">🪜 ${esc(stageName(m.stage))}</span>`:''}</div>${rs.length?`<div class="mini-dots" title="Last ${rs.length} weeks">${rs.map(r=>`<i class="${r.present.includes(m.id)?'p':'a'}"></i>`).join('')}</div>`:''}</div>`};
  const grid=(L,w)=>`<div class="mgrid">${L.map(m=>card(m,w?whyOf(m):'')).join('')}</div>`;
  el.innerHTML=(L1.length||L2.length)?(L1.length?grid(L1,false):'')+(L2.length?`<h4 style="margin:18px 4px 8px" class="muted">Iba pang tugma (LGL, tribe, address, atbp.) \u00b7 ${L2.length}</h4>${grid(L2,true)}`:''):'🔎','Walang nakita','Subukan ang ibang search o filter.'}
function refreshAtt(){const r=curRecord(),el=$('#attSum');if(!r||!el)return;const ms=membersOf(r.groupId),t=ms.filter(m=>m.status!=='Inactive').length,p=r.present.length,tot=p+num(r.visitorCount);
  el.innerHTML=`<div class="bigout" style="margin-bottom:16px"><div><small>Present members</small><b>${p} / ${t}</b></div><div><small>Attendance</small><b>${t?fmt(Math.min(100,p/t*100),0):0}%</b></div><div><small>Visitors</small><b>${num(r.visitorCount)}</b></div><div><small>Total headcount</small><b>${tot}</b></div></div>`}
async function refreshSettings(){const si=$('#storInfo');if(si){const photos=state.members.filter(m=>m.photo).length;let t=`📦 Records: <b>${state.members.length}</b> members (${photos} with photo) · <b>${state.groups.length}</b> groups · <b>${state.records.length}</b> meetings · <b>${state.prayers.length}</b> prayers · data <b>${fmt(JSON.stringify(state).length/1024,1)} KB</b><br>`;
  try{if(navigator.storage&&navigator.storage.estimate){const e=await navigator.storage.estimate();t+=`💽 Browser storage: <b>${fmt((e.usage||0)/1048576,2)} MB</b> used of <b>${fmt((e.quota||0)/1073741824,1)} GB</b> available`}if(navigator.storage&&navigator.storage.persisted){const pz=await navigator.storage.persisted();t+=`<br>${pz?'🛡️ Persistent storage: <b>ON</b>':'⚠️ Persistent storage: not granted — mag-download ng backup regularly'}`}}catch(e){}si.innerHTML=t}

function cyrb(s){let h1=0xdeadbeef,h2=0x41c6ce57;for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677)}

    case'records':return[x.id,x.date,gn(x.groupId),x.topic,x.verse,(x.present||[]).length,(x.present||[]).map(nm).filter(Boolean).join(', '),x.visitorCount,x.visitors,x.newSouls,x.offering,x.prayer,x.testimony,x.notes,(x.present||[]).join(';'),x.groupId];

async function gsPost(body,cfg){if(!cfg&&(body.action==='photo'||body.action==='photos')){const f=driveFolderId();if(f)body=Object.assign({},body,{folderId:f})}const c=cfg||syEff(),ac=new AbortController(),to=setTimeout(()=>ac.abort(),90000);

/* linisin ang mga reference na wala nang pinupuntahan (pagkatapos ng delete / pull) */
function integrity(){const mid=new Set(state.members.map(m=>m.id)),gid=new Set(state.groups.map(g=>g.id));
  state.members.forEach(m=>{if(m.groupId&&!gid.has(m.groupId))m.groupId=''});
  state.groups.forEach(g=>{if(g.leaderId&&!mid.has(g.leaderId))g.leaderId='';if(g.coLeaderId&&!mid.has(g.coLeaderId))g.coLeaderId=''});
  state.records=state.records.filter(r=>gid.has(r.groupId));
  state.records.forEach(r=>{if(Array.isArray(r.present)&&r.present.some(id=>!mid.has(id)))r.present=r.present.filter(id=>mid.has(id))});
  state.prayers=state.prayers.filter(p=>!p.memberId||mid.has(p.memberId));
  state.tasks=state.tasks.filter(t=>!t.memberId||mid.has(t.memberId))}

async function syncCore(){
  const sy=state.meta.sync=state.meta.sync||{};sy.base=sy.base||{};sy.photos=sy.photos||{};

  const pl=await gsPost({action:'pull'}),idx=pl.index||{};sysPack(idx,sy);

    for(const id of Object.keys(R)){if(loc.has(id))continue;const b=base[id];

  /* 2) kunin ang bagong data (bago galawin ang kahit ano) */
  const got={};
  for(const T of SYC){const ids=plan[T].pull.map(p=>p.id);if(ids.length){syMsg(`Kinukuha ang ${ids.length} ${T}…`);got[T]=await fetchItems(T,ids)}}
  const phNeed=[];
  for(const p of plan.members.pull){const d=got.members&&got.members[p.id];if(!d)continue;let o;try{o=JSON.parse(d)}catch(e){continue}
    if(o._ph){const l=state.members.find(m=>m.id===p.id);if(!(l&&l.photo&&cyrb(l.photo)===o._ph))phNeed.push(p.id)}}
  const photos=phNeed.length?await fetchPhotos(phNeed):{};
  /* 3) i-apply */
  for(const T of SYC){const base=sy.base[T],P=plan[T];
    for(const d of P.delLocal){const cur=state[T].find(x=>String(x.id)===d.id);
      if(cur&&wireInfo(T,cur).h===d.h){state[T]=state[T].filter(x=>x!==cur);delete base[d.id];if(T==='members')delete sy.photos[d.id];S.del++}}
    for(const p of P.pull){const dat=got[T]&&got[T][p.id];if(!dat)continue;
      const cur=state[T].find(x=>String(x.id)===p.id);
      if(p.lh!==null&&(!cur||wireInfo(T,cur).h!==p.lh))continue;                 // nabago mo habang nagsi-sync
      let o;try{o=JSON.parse(dat)}catch(e){continue}
      o.id=o.id||p.id;
      if(T==='members'){const ph=o._ph;delete o._ph;o.photo=ph?(p.id in photos?photos[p.id]:(cur&&cur.photo||'')):'';sy.photos[p.id]=ph||''}
      if(cur)state[T][state[T].indexOf(cur)]=o;else state[T].push(o);
      base[p.id]=idx[T][p.id];if(T==='backup'&&String(p.id).indexOf('sys-audit-')===0)S.da=(S.da||0)+1;else S.down++}}
  if(S.down||S.del)integrity();
  /* 4) i-push ang nagbago dito + mga binura dito */
  const counts={members:state.members.length,groups:state.groups.length,records:state.records.length};let calls=0;
  for(const T of SYC){const base=sy.base[T],R=idx[T]||{},loc=new Map(state[T].map(x=>[String(x.id),x])),ups=[];
    for(const[id,x]of loc){const w=wireInfo(T,x),b=base[id],r=R[id];
      if(r===w.h){base[id]=r;continue}
      if(b===w.h&&r!==undefined)continue;
      ups.push({id,x,...w})}
    for(let i=0;i<ups.length;i+=80){const ch=ups.slice(i,i+80);
      if(T==='members')for(const p of ch){const ph=p.x.photo?cyrb(p.x.photo):'';if((sy.photos[p.id]||'')!==ph){syMsg('Uploading photo: '+fullName(p.x)+'…');await gsPost({action:'photo',id:p.id,name:fullName(p.x),first:p.x.first||'',last:p.x.last||'',data:p.x.photo||''});sy.photos[p.id]=ph}}
      syMsg(`Sending ${T} ${Math.min(i+80,ups.length)}/${ups.length}…`);
      await gsPost({action:'push',deviceId:syCfg.id,counts,upserts:{[T]:ch.map(p=>[...dispRow(T,p.x),p.data,p.h])}});calls++;
      ch.forEach(p=>{base[p.id]=p.h;S.up++})}
    const rdel=[];for(const id of Object.keys(base)){if(loc.has(id))continue;const r=R[id];
      if(r===undefined)delete base[id];else if(r===base[id])rdel.push(id)}
    if(rdel.length){syMsg('Binubura sa Sheet…');await gsPost({action:'push',deviceId:syCfg.id,counts,deletes:{[T]:rdel}});calls++;rdel.forEach(id=>{delete base[id];if(T==='members')delete sy.photos[id]});S.rdel+=rdel.length}}
  if(!calls&&Date.now()-(sy.hb||0)>1800e3){await gsPost({action:'push',deviceId:syCfg.id,counts});calls++}
  if(calls)sy.hb=Date.now();
  sy.last=Date.now();try{await idbSet('state',state)}catch(e){}
  if(S.down||S.del){const ae=document.activeElement;
    if(ae&&/INPUT|TEXTAREA|SELECT/.test(ae.tagName)&&$('#view').contains(ae))toast('🔄 May bagong data mula sa Sheet — lumipat ng page para makita');else render()}
  return S}

async function doSync(manual){const c=syEff();if(typeof AUTH!=='undefined'&&!AUTH.user)return;
  if(!authSA()){connSync().catch(e=>{state.meta.connErr=String(e&&e.message||e)})}
  if(!c.url){if(manual){toast('Ilagay muna ang Web App URL ng sarili mong Google Sheet sa Settings','bad');SFX.err()}if(!authSA())syncUpAll().then(r=>{if(manual&&r&&r.sent)toast('\u2b06 '+r.sent+' item ang naipadala sa upline','good');if(manual&&r&&r.errs.length)toast('Up-sync: '+r.errs[0],'bad')}).catch(()=>{});return}
  if(state.meta.demo){if(manual){toast('Demo data pa ito — gamitin ang Restore from Sheet o Erase all data','bad');SFX.err()}return}
  if(SY.busy)return;
  if(!navigator.onLine){syMsg('Offline — magsi-sync kapag may internet','err');return}
  SY.busy=true;
  try{audFlush();await audPut();const S=await syncCore();const _a=sysUnpack(),_b=reconcileSt();if(S.down||S.del||S.se)audLog('SYNC','Google Sheet','','Pinagsama ang data mula sa Sheet: '+(S.down||0)+' pababa, '+(S.del||0)+' binura, '+(S.se||0)+' edit');audRebase();if(_b)save();if(!authSA())syncUpAll().then(r=>{if(manual&&r&&r.sent)toast('\u2b06 '+r.sent+' item ang naipadala sa upline','good');if(manual&&r&&r.errs.length)toast('Up-sync: '+r.errs[0],'bad')}).catch(()=>{});if(_a||_b){try{await idbSet('state',state)}catch(e){}render()}const bits=[S.up&&'⬆️ '+S.up,S.down&&'⬇️ '+S.down,(S.del+S.rdel)&&'🗑️ '+(S.del+S.rdel),S.se&&'✏️ '+S.se+' edit mula sa Sheet',S.da&&'📜 '+S.da+' activity log'].filter(Boolean);
    syMsg('✅ Synced · '+state.members.length+' members'+(bits.length?' · '+bits.join(' · '):' · walang pagbabago'),'ok');
    if(manual){toast('☁️ Synced sa Google Sheet','good');SFX.success()}}
  catch(e){syMsg('❌ '+(e.message||e),'err');if(manual){toast('❌ Hindi na-sync — tingnan ang Settings','bad');SFX.err()}}
  finally{SY.busy=false;renderTop()}}

const BK={h:null,perm:'none',last:0,busy:false,again:false,t:null,err:'',prune:''};

  if(BK.busy){BK.again=true;return false}

    const json=JSON.stringify(state);
    await bkPut('latest.json',json);await bkPut('backup-'+today()+'.json',json);
    BK.last=Date.now();BK.err='';
    if(BK.prune!==today()){BK.prune=today();const names=[];for await(const[n]of BK.h.entries())if(/^backup-\d{4}-\d{2}-\d{2}\.json$/.test(n))names.push(n);
      names.sort();while(names.length>30)await BK.h.removeEntry(names.shift())}
    return true}
  catch(e){BK.err=e.message||String(e);return false}
  finally{BK.busy=false;if(BK.again){BK.again=false;bkSoon()}if($('#bkInfo'))bkPaint()}}

const nrm=t=>String(t||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
const nwords=t=>nrm(t).split(' ').filter(Boolean);
function scanFind(q){const t=nwords(q);if(!t.length)return[];
  return state.members.filter(m=>{const h=nrm([m.last,m.first,m.middle,m.suffix,m.nick,m.code].join(' '));return t.every(w=>h.includes(w))}).sort((a,b)=>fullName(a).localeCompare(fullName(b)))}
/* Para sa QR na pangalan ang laman: "Santos, Maria Luz, JR" / "Santos, Maria Luz" / "Santos" */
function scanMatch(v){const T=[...new Set(nwords(v))];if(!T.length)return[];
  const core=m=>[...new Set([...nwords(m.last),...nwords(m.first),...nwords(m.suffix)])],all=m=>new Set([...core(m),...nwords(m.middle),...nwords(m.nick)]);
  let h=state.members.filter(m=>{const W=all(m);return T.every(t=>W.has(t))});
  if(h.length>1){const full=h.filter(m=>{const C=[...new Set([...core(m),...nwords(m.middle)])];return C.length===T.length&&C.every(c=>T.includes(c))});if(full.length===1)return full;const eq=h.filter(m=>{const C=core(m);return C.length===T.length&&C.every(c=>T.includes(c))});if(eq.length===1)return eq}
  if(h.length)return h;
  const lp=nrm(String(v).split(',')[0]),rest=T.filter(t=>!lp.split(' ').includes(t));

/* ===================== QR code ng member ===================== */

/* ===================== Download all QR (ZIP) ===================== */
function crc32(u){let c,crc=-1;if(!crc32.t){crc32.t=[];for(let n=0;n<256;n++){c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;crc32.t[n]=c>>>0}}for(let i=0;i<u.length;i++)crc=crc32.t[(crc^u[i])&255]^(crc>>>8);return(crc^-1)>>>0}

  for(const f of files){const nm=enc.encode(f.name),crc=crc32(f.data),sz=f.data.length;
    const lh=new DataView(new ArrayBuffer(30));lh.setUint32(0,0x04034b50,true);lh.setUint16(4,20,true);lh.setUint16(6,0x0800,true);lh.setUint16(10,tm,true);lh.setUint16(12,dt,true);lh.setUint32(14,crc,true);lh.setUint32(18,sz,true);lh.setUint32(22,sz,true);lh.setUint16(26,nm.length,true);
    parts.push(new Uint8Array(lh.buffer),nm,f.data);
    const ch=new DataView(new ArrayBuffer(46));ch.setUint32(0,0x02014b50,true);ch.setUint16(4,20,true);ch.setUint16(6,20,true);ch.setUint16(8,0x0800,true);ch.setUint16(12,tm,true);ch.setUint16(14,dt,true);ch.setUint32(16,crc,true);ch.setUint32(20,sz,true);ch.setUint32(24,sz,true);ch.setUint16(28,nm.length,true);ch.setUint32(42,off,true);
    cen.push(new Uint8Array(ch.buffer),nm);off+=30+nm.length+sz}
  let cs=0;for(const c of cen)cs+=c.length;
  const e=new DataView(new ArrayBuffer(22));e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,cs,true);e.setUint32(16,off,true);
  return new Blob([...parts,...cen,new Uint8Array(e.buffer)],{type:'application/zip'})}

/* ===================== QR cards → PDF (2.25 in × 3 in kada QR) ===================== */
function qrDrawTo(x,text,size){const q=new QRLIB(-1,0);q.addData(unescape(encodeURIComponent(String(text))));q.make();
  const n=q.getModuleCount(),quiet=4,u=size/(n+quiet*2);x.fillStyle='#000';
  for(let r=0;r<n;r++)for(let k=0;k<n;k++)if(q.isDark(r,k)){const x0=Math.round((k+quiet)*u),y0=Math.round((r+quiet)*u),x1=Math.round((k+quiet+1)*u),y1=Math.round((r+quiet+1)*u);x.fillRect(x0,y0,x1-x0,y1-y0)}}
/* 675 × 900 px = 2.25 × 3 in sa 300 dpi */
function qrCardPdf(m,border){const W=675,H=900,c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d'),L=qrLines(m);
  x.fillStyle='#fff';x.fillRect(0,0,W,H);qrDrawTo(x,qrValue(m),W);x.textAlign='center';x.textBaseline='alphabetic';
  const fit=(t,fs,wt)=>{x.font=wt+' '+fs+'px Segoe UI,Arial,sans-serif';while(x.measureText(t).width>W-60&&fs>16){fs-=2;x.font=wt+' '+fs+'px Segoe UI,Arial,sans-serif'}};
  const y1=L.length>1?W+86:W+120;
  x.fillStyle='#0f3b36';if(L[0]){fit(L[0],64,'800');x.fillText(L[0],W/2,y1)}
  x.fillStyle='#16201e';if(L[1]){fit(L[1],48,'500');x.fillText(L[1],W/2,W+166)}
  if(border){x.strokeStyle='#222';x.lineWidth=6;x.strokeRect(3,3,W-6,H-6)}return c}
function pdfBuild(pages,imgs){const enc=new TextEncoder(),chunks=[],offs=[];let pos=0;
  const put=d=>{const u=typeof d==='string'?enc.encode(d):d;chunks.push(u);pos+=u.length};
  const obj=(n,fn)=>{offs[n]=pos;put(n+' 0 obj\n');fn();put('\nendobj\n')};
  const nI=imgs.length,pObj=p=>3+nI+2*p,total=2+nI+2*pages.length,f=v=>(+v).toFixed(2);
  put('%PDF-1.4\n%âãÏÓ\n');

  obj(2,()=>put('<</Type/Pages/Kids['+pages.map((_,p)=>pObj(p)+' 0 R').join(' ')+']/Count '+pages.length+'>>'));
  imgs.forEach((im,i)=>obj(3+i,()=>{put('<</Type/XObject/Subtype/Image/Width '+im.w+'/Height '+im.h+'/ColorSpace/DeviceRGB/BitsPerComponent 8/Filter/DCTDecode/Length '+im.data.length+'>>\nstream\n');put(im.data);put('\nendstream')}));
  pages.forEach((pg,p)=>{const used=[...new Set(pg.items.map(t=>t.i))];
    let cs='';pg.items.forEach(t=>{cs+='q '+f(t.w)+' 0 0 '+f(t.h)+' '+f(t.x)+' '+f(t.y)+' cm /Im'+t.i+' Do Q\n'});
    if(pg.items.length>1){cs+='0.55 G 0.4 w\n';pg.items.forEach(t=>{cs+=f(t.x)+' '+f(t.y)+' '+f(t.w)+' '+f(t.h)+' re S\n'})}
    obj(pObj(p),()=>put('<</Type/Page/Parent 2 0 R/MediaBox[0 0 '+f(pg.W)+' '+f(pg.H)+']/Resources<</XObject<<'+used.map(i=>'/Im'+i+' '+(3+i)+' 0 R').join('')+'>>>>/Contents '+(pObj(p)+1)+' 0 R>>'));
    obj(pObj(p)+1,()=>{const b=enc.encode(cs);put('<</Length '+b.length+'>>\nstream\n');put(b);put('endstream')})});
  const xr=pos;put('xref\n0 '+(total+1)+'\n0000000000 65535 f \n');

function pdfQr(imgs,mode,paper,orient){const CW=162,CH=216,pages=[];

  else{let P=paper==='a4'?[595.28,841.89]:paper==='long'?[612,936]:[612,792];if(orient==='landscape')P=[P[1],P[0]];
    const G=8,M=18,cols=Math.max(1,Math.floor((P[0]-2*M+G)/(CW+G))),rows=Math.max(1,Math.floor((P[1]-2*M+G)/(CH+G))),per=cols*rows,

  return pdfBuild(pages,imgs)}

let scanPending=null,scanReopen=false;
function parseScanName(t){t=String(t||'').trim();let last='',first='',suffix='',middle='';
  if(t.includes(',')){/* Last, First [Suffix] [Middle]  hal. “Dela Cruz, Juan Jr.” · “Alfredo, Alfredo Agoncillo” */
    const i=t.indexOf(','),w=t.slice(i+1).replace(/,/g,' ').split(/\s+/).filter(Boolean);last=t.slice(0,i).trim();
    const k=w.findIndex((x,j)=>j>0&&/^(JR|SR|II|III|IV|V)$/.test(x.replace(/\.$/,'').toUpperCase()));
    if(k>0){suffix=w[k].replace(/\.$/,'').toUpperCase();first=w.slice(0,k).join(' ');middle=w.slice(k+1).join(' ')}else first=w.join(' ')}
  else{const w=t.split(/\s+/).filter(Boolean);last=w.length>1?w[w.length-1]:w[0]||'';first=w.length>1?w.slice(0,-1).join(' '):''}
  return{last:qrTc(last),first:qrTc(first),middle:qrTc(middle),suffix}}

/* WSAM-LGAM = WSA + LGA sources · WSAM = WSA sources lang · LGAM = LGA sources lang
   Sa isang linggo (Lunes–Linggo), 1 count lang sa WSA group (WSAP1/WSAP2/ESC/WES1/WES2)
   at 1 count lang sa LGA group (LGAP1/LGAP2), kahit ilang session ang dinaluhan. */
const SRC_WSA=['WSAP1','WSAP2','ESC','WES1','WES2'],SRC_LGA=['LGAP1','LGAP2'];let FOR_TARGET=16,CALC_YEARS=1,CALC_MONTHS=12,FOLLOW_MIN=0;

function applyCalc(){const c=(typeof state!=='undefined'&&state&&state.settings&&state.settings.calc)||{};FOR_TARGET=Math.max(1,parseInt(c.target)||16);CALC_YEARS=Math.max(1,parseInt(c.resetYears)||1);CALC_MONTHS=Math.max(1,parseInt(c.journeyMonths)||12);FOLLOW_MIN=Math.max(0,parseInt(c.followMin)||0)}
let _wkI=null;
/* Effective join date: kung may attendance na ang member bago ang nakalagay na "Date added", ang unang attendance ang gagamitin */
function effJ(m){const I=wkIdx();if(!I.fp){I.fp={};state.records.forEach(r=>r.present.forEach(id=>{if(!I.fp[id]||r.date<I.fp[id])I.fp[id]=r.date}))}
  const f=I.fp[m.id],j=m.joined||'';return j&&f&&f<j?f:j}

function wkIdx(){if(_wkI)return _wkI;const I={W:new Map(),L:new Map()};
  state.records.forEach(r=>{const c=recCat(r),t=SRC_WSA.includes(c)?'W':SRC_LGA.includes(c)?'L':'';if(!t)return;const mon=weekOf(r.date).mon;let a=I[t].get(mon);if(!a){a=[];I[t].set(mon,a)}a.push(r)});
  return _wkI=I}
const memTracks=m=>{const s=normSt(m.status);return s==='WSAM'?['W']:s==='LGAM'?['L']:['W','L']};
/* listahan ng linggo (pinakabago muna) na may session; p = ilang group ang dinaluhan (0–2) */
function memberWeeks(m){const I=wkIdx(),T=memTracks(m),mons=new Set(),out=[];
  T.forEach(t=>I[t].forEach((_,k)=>mons.add(k)));
  [...mons].sort().reverse().forEach(mon=>{let held=0,p=0,dt='',pd='';const pt={},pf={};const src=[];
    T.forEach(t=>{const rs=(I[t].get(mon)||[]).filter(r=>r.date>=effJ(m));if(!rs.length)return;held++;rs.forEach(r=>{if(r.date>dt)dt=r.date});
      const pr=rs.filter(r=>r.present.includes(m.id));if(pr.length){p++;pt[t]=1;pr.forEach(r=>{if(!pf[t]||r.date<pf[t])pf[t]=r.date;if(r.date>pd)pd=r.date;src.push(catLabel(recCat(r)))})}});
    if(held)out.push({mon,held,p,pw:pt.W||0,pl:pt.L||0,fw:pf.W||'',fl:pf.L||'',date:pd||dt,topic:p?[...new Set(src)].join(' + '):'Absent',present:p?[m.id]:[]})});
  return out}

/* 16 attendance sa loob ng 1 taon (mula sa unang pagdalo). Kung lumampas ang 1 taon nang hindi umabot ng 16 -> reset sa 0 */
function cycle16(m){const ws=memberWeeks(m).filter(w=>w.p).reverse();let hit='';
  /* Hiwalay ang cycle ng WSA (W) at LGA (L): bawat isa ay may sariling unang pagdalo at 1 taon.
     Kapag lumampas ang 1 taon mula sa unang pagdalo sa track na iyon at hindi pa umaabot sa 16 ang WSA o ang LGA, nagre-reset sa 0 ang track na iyon.
     Hindi binubura ang attendance records/history — ang bilang lang ang nagre-reset. */
  const T={W:{st:'',n:0},L:{st:'',n:0}},K=[['W','pw','fw'],['L','pl','fl']],rst=t=>{t.st='';t.n=0};
  for(const w of ws){
    for(const [k,pk,fk] of K){if(!w[pk])continue;const t=T[k],d=w[fk]||w.date;
      if(t.st&&d>addYear(t.st))rst(t);if(!t.st)t.st=d;t.n++}
    if(T.W.n>=FOR_TARGET||T.L.n>=FOR_TARGET){hit=w.date;break}}
  if(!hit)['W','L'].forEach(k=>{if(T[k].st&&today()>addYear(T[k].st))rst(T[k])});
  const st=[T.W.st,T.L.st].filter(Boolean).sort()[0]||'';
  return{st,n:T.W.n+T.L.n,mx:Math.max(T.W.n,T.L.n),nw:T.W.n,nl:T.L.n,fw:T.W.st,fl:T.L.st,hit,end:st?addYear(st):''}}

function lglListMap(){const IX=ssIndex(),map={},KI=new Map(),
  keyOf=m=>[nrm([m.last,m.first,m.suffix,m.middle].join(' ')),nrm([m.last,m.first,m.middle,m.suffix].join(' ')),nrm([m.last,m.first,m.suffix].join(' ')),nrm([m.last,m.first].join(' '))];
  state.members.forEach(x=>{new Set(keyOf(x)).forEach(k=>{if(!k)return;if(!KI.has(k))KI.set(k,[]);KI.get(k).push(x)})});
  const memo={},resolve=(nm,tn,f)=>{const q=nm+'\u0000'+(tn||'')+'\u0000'+(f&&KI.has(nrm(nm))&&KI.get(nrm(nm)).includes(f)?f.id:'');if(q in memo)return memo[q];

    if(!m){const c=KI.get(nrm(nm))||[];if(c.length){if(f&&c.includes(f))m=f;           /* ang LG Leader niya ay siya mismo */
      else{const c2=tn?c.filter(x=>x.tribe===tn):c,pick=c2.length?c2:c;if(pick.length===1)m=pick[0]}}}

      var vals = sheet_().getDataRange().getDisplayValues();

const FIN_GAS=String.raw`/* Finance Sheet receiver — i-paste sa Extensions > Apps Script ng FINANCE SHEET na ito */
var KEY = '';          // optional: dapat kapareho ng "Secret key" sa app
var SHEET_NAME = '';   // blangko = unang tab
// Columns: A = Amount, B = Particulars, C = Date

function norm_(s){ return String(s||'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim(); }
function day_(v){
  var tz = Session.getScriptTimeZone();
  if (v instanceof Date) return Utilities.formatDate(v, tz, 'yyyy-MM-dd');
  var t = String(v||'').trim(), m = t.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (m) return m[0];
  m = t.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  if (m) return m[3]+'-'+('0'+m[1]).slice(-2)+'-'+('0'+m[2]).slice(-2);
  var d = new Date(t);
  return isNaN(d) ? '' : Utilities.formatDate(d, tz, 'yyyy-MM-dd');
}
function sheet_(){ var ss = SpreadsheetApp.getActiveSpreadsheet(); return SHEET_NAME ? ss.getSheetByName(SHEET_NAME) : ss.getSheets()[0]; }
function out_(o){ return ContentService.createTextOutput(JSON.stringify(o)).setMimeType(ContentService.MimeType.JSON); }
function doGet(){ return out_({ok:true, msg:'Finance sheet script is running'}); }

function doPost(e){
  var lock = LockService.getScriptLock(); lock.waitLock(20000);
  try {
    var b = JSON.parse(e.postData.contents);
    if (KEY && b.key !== KEY) return out_({ok:false, error:'Maling key'});
    var sh = sheet_(), last = sh.getLastRow(), idx = {};
    if (last > 1) {
      var v = sh.getRange(2,1,last-1,3).getValues();
      for (var i=0;i<v.length;i++) {
        if (v[i][0]==='' && v[i][1]==='') continue;
        var k = norm_(v[i][1])+'|'+day_(v[i][2]);
        (idx[k] = idx[k] || []).push(i+2);
      }
    }
    var add = [], dup = 0, upd = 0, skip = 0;
    (b.ops||[]).forEach(function(op){
      var k = norm_(op.particular)+'|'+op.date, rows = idx[k] || [];
      if (op.mode === 'update') {
        if (rows.length === 1) { sh.getRange(rows[0],1).setValue(op.amount); upd++; } else skip++;
        return;
      }
      if (rows.length) { dup++; return; }
      idx[k] = [-1];
      var p = op.date.split('-');
      add.push([op.amount, op.particular, new Date(+p[0], +p[1]-1, +p[2])]);
    });
    if (add.length) {
      var start = sh.getLastRow()+1, src = sh.getRange(Math.max(2, start-1),1,1,3), dst = sh.getRange(start,1,add.length,3);
      src.copyTo(dst, SpreadsheetApp.CopyPasteType.PASTE_FORMAT, false);
      src.copyTo(dst, SpreadsheetApp.CopyPasteType.PASTE_DATA_VALIDATION, false);
      dst.setValues(add);
    }
    return out_({ok:true, added:add.length, updated:upd, duplicates:dup, skipped:skip});
  } catch(err) { return out_({ok:false, error:String(err)}); }
  finally { lock.releaseLock(); }
}`;

function dupKey(a,b){return [a.id,b.id].sort().join('|')}

const dupDifBd=a=>a.every(m=>m.bday)&&new Set(a.map(m=>m.bday)).size===a.length;
function dupSplit(c){const no=new Set(state.settings.dupNot||[]);if(!no.size)return[c];
  const par=c.map((_,i)=>i),f=i=>par[i]===i?i:(par[i]=f(par[i]));
  for(let i=0;i<c.length;i++)for(let j=i+1;j<c.length;j++)if(!no.has(dupKey(c[i],c[j])))par[f(i)]=f(j);
  const g=new Map();c.forEach((x,i)=>{const r=f(i);if(!g.has(r))g.set(r,[]);g.get(r).push(x)});return[...g.values()].filter(a=>a.length>1)}
function dupGroups(){const m=new Map();state.members.forEach(x=>{if(!nrm(x.first))return;const k=nrm(x.last)+'|'+nrm(x.first)+'|'+nrm(x.suffix);if(!m.has(k))m.set(k,[]);m.get(k).push(x)});
  const out=[],mi=x=>nrm(x.middle).charAt(0);
  m.forEach(list=>{const cl=[];list.forEach(x=>{const c=cl.find(a=>a.every(y=>!mi(x)||!mi(y)||mi(x)===mi(y)));if(c)c.push(x);else cl.push([x])});cl.forEach(c=>{if(c.length>1)dupSplit(c).forEach(g=>out.push(g))})});
  return out.sort((a,b)=>fullName(a[0]).localeCompare(fullName(b[0])))}

function fx(){const c=$('#fx'),x=c.getContext('2d');let W,H,D=Math.min(2,devicePixelRatio||1),mx=0,my=0;
  const rs=()=>{W=c.width=innerWidth*D;H=c.height=innerHeight*D;c.style.width=innerWidth+'px';c.style.height=innerHeight+'px'};rs();addEventListener('resize',rs);
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  const np=init=>({x:Math.random()*W,y:init?Math.random()*H:-30,z:Math.random()*.8+.2,a:Math.random()*6.28,va:(Math.random()-.5)*.03,s:Math.random()*6.28,t:Math.random()<.75?'leaf':'mote'});
  const P=Array.from({length:reduce?8:26},()=>np(true));
  addEventListener('pointermove',e=>{mx=e.clientX/innerWidth-.5;my=e.clientY/innerHeight-.5});
  const leaf=(px,py,r,a)=>{x.save();x.translate(px,py);x.rotate(a);x.fillStyle='#4c7fa3';x.beginPath();x.moveTo(0,-r*1.6);x.quadraticCurveTo(r*1.1,0,0,r*1.6);x.quadraticCurveTo(-r*1.1,0,0,-r*1.6);x.fill();x.strokeStyle='rgba(255,255,255,.5)';x.lineWidth=D;x.beginPath();x.moveTo(0,-r*1.3);x.lineTo(0,r*1.3);x.stroke();x.restore()};

    const lv=R.lv+1;modal('\uff0b '+SCOPE_LBL[SCOPE_KEYS[lv]],`<p class="hint" style="margin:0 0 10px">${R.names.length?esc(R.names.join(' \u203a ')):'Bagong Region'}</p><div class="fgrid"><label class="f full"><span>${SCOPE_LBL[SCOPE_KEYS[lv]]} name</span><input class="in" id="ogN" maxlength="80" autocomplete="off" placeholder="${lv===0?'hal. Region 2':''}"></label></div>`,`<button class="btn ghost" data-act="closeModal">Cancel</button><button class="btn" data-act="orgAddGo" data-p="${esc(el.dataset.p)}">Add</button>`);setTimeout(()=>{const i=$('#ogN');i&&i.focus()},50)},
  orgAddGo(el){const me=authMe(),R=orgResolve(el.dataset.p);if(!R)return;if(!orgCanAdd(me,R.lv,R.names))return;const lv=R.lv+1,name=authVal('ogN').trim();if(!name){SFX.err();return toast('Ilagay ang pangalan','bad')}

    R.childArr.push(lv===3?name:lv===2?{n:name,c:[]}:lv===1?{n:name,d:[]}:{n:name,p:[]});
    audLog('ORGANIZATION EDIT','Settings','','Added '+SCOPE_LBL[SCOPE_KEYS[lv]]+': '+R.names.concat(name).join(' \u203a ')+' (by '+me.u+')');audPut();closeModal();save();render();SFX.success()},
  orgRename(el){const me=authMe(),R=orgResolve(el.dataset.p);if(!R||R.lv<0||!authStill())return;if(!orgCanMod(me,R.lv,R.names)){SFX.err();return toast('Walang pahintulot ang role mo dito','bad')}
    modal('Rename '+SCOPE_LBL[SCOPE_KEYS[R.lv]],`<p class="hint" style="margin:0 0 10px">${esc(R.names.join(' \u203a '))}. Ia-update din ang mga account${R.lv===3?' at members':''} na gumagamit ng pangalang ito.</p><div class="fgrid"><label class="f full"><span>Bagong pangalan</span><input class="in" id="ogN" value="${esc(R.names[R.lv])}" maxlength="80" autocomplete="off"></label></div>`,`<button class="btn ghost" data-act="closeModal">Cancel</button><button class="btn" data-act="orgRenameGo" data-p="${esc(el.dataset.p)}">Save</button>`)},
  async orgRenameGo(el){const me=authMe(),R=orgResolve(el.dataset.p);if(!R||R.lv<0||!orgCanMod(me,R.lv,R.names))return;const old=R.names[R.lv],nu=authVal('ogN').trim();if(!nu){SFX.err();return toast('Ilagay ang pangalan','bad')}if(nu===old){closeModal();return}
    if(R.parentArr.some((x,i)=>i!==R.idx&&(R.lv===3?x:x.n).toLowerCase()===nu.toLowerCase())){SFX.err();return toast('Nandito na ang pangalang iyan','bad')}
    if(R.lv===3&&orgChurchesAll().some(c=>c.toLowerCase()===nu.toLowerCase())){SFX.err();return toast('Nasa ibang district na ang church na iyan','bad')}
    const key=SCOPE_KEYS[R.lv],names=R.names.slice();let nu_acc=0;(AUTH.data.users||[]).forEach(u=>{if(names.every((x,i)=>(u[SCOPE_KEYS[i]]||'')===x)){u[key]=nu;nu_acc++}});
    let nm=0;if(R.lv===3)state.members.forEach(m=>{if(m.church===old){m.church=nu;nm++}});
    if(R.lv===3)R.parentArr[R.idx]=nu;else R.node.n=nu;
    await authSave();audLog('ORGANIZATION EDIT','Settings','','Renamed '+SCOPE_LBL[key]+': '+old+' \u2192 '+nu+' ('+nu_acc+' account, '+nm+' member) by '+me.u);await audPut();closeModal();save();render();SFX.success();toast('Na-rename','good')},
  orgDel(el){const me=authMe(),R=orgResolve(el.dataset.p);if(!R||R.lv<0||!authStill())return;if(!orgCanMod(me,R.lv,R.names)){SFX.err();return toast('Walang pahintulot ang role mo dito','bad')}
    const accs=orgUsersUnder(R.lv,R.names);if(accs.length){SFX.err();return toast('May '+accs.length+' account na gumagamit nito ('+accs.slice(0,3).map(u=>u.u).join(', ')+'). Ilipat o i-disable muna sa Accounts.','bad')}
    const chs=orgChurchesUnder(R.lv,R.names),nm=state.members.filter(m=>chs.includes(m.church)).length;
    confirmBox(`Burahin ang <b>${esc(R.names.join(' \u203a '))}</b>${R.lv<3?' at lahat ng nasa ilalim nito':''}?${nm?`<br><span style="color:var(--warn)">May ${nm} member na naka-tag sa mga church na ito. Hindi sila mabubura pero hindi na lalabas sa dropdown.</span>`:''}`,()=>{const R2=orgResolve(el.dataset.p);if(!R2||!orgCanMod(authMe(),R2.lv,R2.names))return;R2.parentArr.splice(R2.idx,1);audLog('ORGANIZATION EDIT','Settings','','Deleted '+R2.names.join(' \u203a ')+' by '+me.u);audPut();save();render();SFX.success()},'Delete')},
  orgAssign(){if(!authSA())return;const L=orgChurchesAll();if(!L.length)return;modal('Assign church',`<p class="hint" style="margin:0 0 10px">Lahat ng member na walang church ay itatalaga sa napiling church.</p><div class="fgrid"><label class="f full"><span>Church</span><select class="in" id="ogC">${L.map(c=>`<option>${esc(c)}</option>`).join('')}</select></label></div>`,`<button class="btn ghost" data-act="closeModal">Cancel</button><button class="btn" data-act="orgAssignGo">Assign</button>`)},
  orgAssignGo(){if(!authSA())return;const c=authVal('ogC');if(!c)return;let n=0;state.members.forEach(m=>{if(!m.church){m.church=c;n++}});audLog('ORGANIZATION EDIT','Settings','','Assigned '+n+' member(s) without church to '+c);audPut();closeModal();save();render();SFX.success();toast(n+' member ang na-assign','good')},
  acctEditDn(el){if(!authReqMgr('Edit display name',el.dataset.k))return;const r=authFind(el.dataset.k);if(!r)return;modal('Display name — '+esc(r.u),`<p class="hint" style="margin:0 0 10px">Ito ang pangalang makikita sa Dashboard ng account na ito. Hindi nagbabago ang username.</p><div class="fgrid"><label class="f full"><span>Display name</span><input class="in" id="acD" value="${esc(r.dn||'')}" maxlength="60" autocomplete="off"></label></div>`,`<button class="btn ghost" data-act="closeModal">Cancel</button><button class="btn" data-act="acctEditDnGo" data-k="${esc(r.k)}">Save</button>`)},
  async acctEditDnGo(el){if(!authReqMgr('Edit display name',el.dataset.k))return;const r=authFind(el.dataset.k);if(!r)return;const o=r.dn||'';r.dn=authVal('acD').trim().slice(0,60);await authSave();audLog('DISPLAY NAME CHANGE','Account',r.u,'Display name: "'+o+'" → "'+r.dn+'" (by Super Admin)');await audPut();closeModal();SFX.success();toast('Na-save ang display name','good');render()},
  acctReset(el){if(!authReqMgr('Password reset',el.dataset.k))return;const r=authFind(el.dataset.k);if(!r)return;modal('Reset password — '+esc(r.u),`<p class="hint" style="margin:0 0 10px">Magtakda ng temporary password. Kailangan itong palitan ng user pagka-sign in. Hindi ipinapakita ang kasalukuyang password.</p><div class="fgrid"><label class="f full"><span>Temporary password</span><input class="in" id="acT" value="${tempPw()}" autocomplete="off"></label></div>`,`<button class="btn ghost" data-act="closeModal">Cancel</button><button class="btn" data-act="acctResetGo" data-k="${esc(r.k)}">Continue</button>`)},
  acctResetGo(el){if(!authReqMgr('Password reset',el.dataset.k))return;const r=authFind(el.dataset.k),p=authVal('acT');if(!r)return;const e=authPwErr(p);if(e){SFX.err();return toast(esc(e),'bad')}
    confirmBox(`I-reset ang password ni <b>${esc(r.u)}</b>? Magiging temporary ang bagong password at kailangan niyang palitan ito.`,async()=>{if(!authReqMgr('Password reset',r.k))return;r.salt=authSalt();r.hash=await authHash(p,r.salt,AUTH_IT);r.it=AUTH_IT;r.must=true;r.fails=0;r.lock=0;await authSave();
      audLog('PASSWORD RESET','Account',r.u,'Password reset by Super Admin; temporary password issued (must change at next sign-in)');await audPut();render();SFX.success();
      modal('✅ Na-reset ang password',`<p style="line-height:1.6">Account: <b>${esc(r.u)}</b><br>Temporary password: <code class="rcode" style="display:inline-block;margin:6px 0">${esc(p)}</code></p><p class="hint">Ibigay ito sa user. Ipapakita lang ito ngayon.</p><button class="btn ghost sm" data-act="acctCopy" data-t="${esc('Username: '+r.u+'\nTemporary password: '+p+'\nPagka-sign in, palitan agad ang password.')}">Copy message</button>`,`<button class="btn" data-act="closeModal">OK</button>`)},'Reset')},
  acctCopy(el){const t=el.dataset.t||'',done=()=>{SFX.success();toast('Na-copy ang message','good')},fail=()=>toast('Hindi ma-copy; i-copy nang mano-mano','bad');if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(done,fail);else fail()},
  acctToggle(el){if(!authReqMgr('Account status change',el.dataset.k))return;const r=authFind(el.dataset.k);if(!r)return;const to=!r.active;
    if(!to&&r.role==='superadmin'&&authActiveSAs().length<=1){audLog('ACCOUNT DISABLE DENIED','Account',r.u,'Cannot disable the last active Super Admin');audPut();SFX.err();return toast('Hindi puwedeng i-disable ang nag-iisang active na Super Admin','bad')}
    confirmBox(`${to?'I-enable':'I-disable'} ang account ni <b>${esc(r.u)}</b>?`,async()=>{if(!authReqMgr('Account status change',r.k))return;if(!to&&r.role==='superadmin'&&authActiveSAs().length<=1)return;r.active=to;r.fails=0;r.lock=0;await authSave();audLog(to?'ACCOUNT ENABLED':'ACCOUNT DISABLED','Account',r.u,'Account '+(to?'enabled':'disabled')+' by Super Admin');await audPut();render();SFX.success();toast(to?'Na-enable ang account':'Na-disable ang account','good');if(r.k===AUTH.key&&!to)authStill()},to?'I-enable':'I-disable')},
  audCsv(){if(!authReqSA('Export activity log'))return;const L=audFiltered();download('activity-log-'+today()+'.csv',toCSV([['Timestamp','Username','Action','Record type','Record ID','Details','Before','After'],...L.map(e=>[e.ts,e.by||('(not signed in)'+(e.attempt?' '+e.attempt:'')),e.action,e.rec,e.rid,e.details,e.before?JSON.stringify(e.before):'',e.after?JSON.stringify(e.after):''])]),'text/csv')}
});

function idbPutMany(pairs){return new Promise((res,rej)=>{if(!db)return rej(new Error('no db'));const tx=db.transaction(STORE,'readwrite'),st=tx.objectStore(STORE);pairs.forEach(([k,v])=>st.put(v,k));tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error);tx.onabort=()=>rej(tx.error||new Error('aborted'))})}
/* state + history ay isinusulat sa IISANG transaction (sabay na na-save o sabay na hindi) */
function audPairs(){const p=[...AUD.dirty].map(ym=>['audit:'+ym,AUD.log.filter(e=>e.ts.slice(0,7)===ym)]);p.n=AUD.log.length;return p}
function audDone(p){if(AUD.log.length===p.n)p.forEach(([k])=>AUD.dirty.delete(k.slice(6)))}
/* ===================== Members: duplicate check, validation, per-member History ===================== */
const phoneKey=v=>{const d=String(v||'').replace(/\D/g,'');return d.length>=10?d.slice(-10):d};
const MEMDUP={ok:false},MH={id:'',code:'',q:'',from:'',to:'',sort:'new'};
const audFL=k=>({code:'Member ID',groupId:'Group',stage:'Stage',nick:'Nickname',photo:'Photo',church:'Church',created:'Created',__sh:'Status history'})[k]||(IMP_COLS.find(c=>c[0]===k)||[])[1]||k;
const audVal=(k,j)=>{if(k==='photo')return j?'(photo)':'';let v=audJ(j);if(v===''||v==null)return '';if(k==='groupId'){const g=groupById(v);v=g?g.name:v}if(typeof v==='boolean')v=v?'Yes':'No';else if(typeof v==='object')v=JSON.stringify(v);v=String(v);return v.length>300?v.slice(0,300)+'…':v};
function audMh(mid,code,action,f,o,n,k){const e=audLog('MEMBER '+action.toUpperCase(),'Member',code,'',{ids:[mid]});e.t='mh';e.mid=mid;e.act=action;e.f=f;e.k=k||'';e.o=o==null?'':o;e.n=n==null?'':n;return e}
/* ---- validation (bago at edit) ---- */
function memValidate(d,isNew){const e=[];if(!String(d.first||'').trim())e.push('Ilagay ang first name');if(!String(d.last||'').trim())e.push('Ilagay ang last name');
  if(d.bday){if(!/^\d{4}-\d{2}-\d{2}$/.test(d.bday)||isNaN(Date.parse(d.bday)))e.push('Hindi valid ang birthday');else if(d.bday>today())e.push('Hindi puwedeng nasa hinaharap ang birthday');else if(d.bday<'1900-01-01')e.push('Masyadong luma ang birthday')}
  if(d.phone){const dg=String(d.phone).replace(/\D/g,'');if(!/^[0-9+\-()\s.]+$/.test(d.phone)||dg.length<7||dg.length>15)e.push('Hindi valid ang contact number (7–15 digits)')}
  if(d.email&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(d.email))e.push('Hindi valid ang email');
  return e[0]?e.join(' · '):''}
/* ---- duplicate check: Member ID, pangalan (case/space-insensitive), birthday, contact number ---- */
function memDupCheck(d,exId){const key=nameKeyOf(d),base=nameBaseOf(d),tail=impTail(impNameParts(d)),b=d.bday||'',ph=phoneKey(d.phone),em=nrm(d.email),code=String(d.code||'').trim().toLowerCase(),out=[];
  state.members.forEach(m=>{if(exId&&m.id===exId)return;const why=[];let strong=false,poss=false;const mk=nameKeyOf(m),mb=m.bday||'',mp=phoneKey(m.phone),me=nrm(m.email);
    if(code&&String(m.code||'').toLowerCase()===code){strong=true;why.push('Parehong Member ID')}
    if(mk===key){if(!b||!mb||mb===b){strong=true;why.push('Parehong pangalan'+(b&&mb===b?' at birthday':''))}else{poss=true;why.push('Kapangalan pero magkaiba ang birthday')}}
    else if(nameBaseOf(m)===base&&(impSub(tail,impTail(impNameParts(m)))||impSub(impTail(impNameParts(m)),tail))){const proof=(b&&mb===b)?'birthday':(ph&&mp===ph)?'contact number':(em&&me===em)?'email':'';if(proof){strong=true;why.push('Halos parehong pangalan at parehong '+proof)}}
    if(!strong&&ph&&mp===ph){poss=true;why.push('Parehong contact number (puwedeng pamilya ang may-ari)')}
    if(strong||poss)out.push({m,level:strong?'strong':'possible',why})});
  return out.sort((a,b)=>(a.level==='strong'?0:1)-(b.level==='strong'?0:1))}
function memDupShow(d,D){const strong=D.some(x=>x.level==='strong'),host=$('#mf')&&$('#mf').parentElement;if(!host)return;const old=$('#memDupBox');if(old)old.remove();
  const addr=m=>[m.purok,m.barangay,m.city,m.province].filter(Boolean).join(', ');
  const rows=D.slice(0,5).map(x=>{const m=x.m;return `<details class="dupr" style="margin:6px 0" ${x.level==='strong'?'open':''}><summary><b>${esc(fullName(m))}</b> · ${esc(m.code||'')} · ${x.level==='strong'?'Malakas na tugma':'Posibleng tugma'} — ${esc(x.why.join(' · '))}</summary><div style="font-size:12.5px;line-height:1.6;margin-top:4px">Birthday: ${m.bday?esc(dateLabel(m.bday)):'N/A'} · Contact: ${esc(m.phone||'N/A')} · Email: ${esc(m.email||'N/A')}<br>Tribe: ${esc(m.tribe||'N/A')} · Status: ${esc(m.status||'N/A')} · Tirahan: ${esc(addr(m)||'N/A')}</div></details>`}).join('');
  const box=`<div id="memDupBox" class="amsg ${strong?'bad':'info'}" style="margin:0 0 12px"><b>${strong?'⚠️ May kapareho nang member':'ℹ️ Posibleng duplicate'}</b> — suriin muna ang existing record bago magdagdag.${rows}${D.length>5?`<div class="hint">…at ${D.length-5} pa</div>`:''}
  ${strong?'<label style="display:block;margin:8px 0"><input type="checkbox" id="dupAck"> Naiintindihan ko na may kapareho na; ibang tao ito at gusto ko pa ring idagdag.</label>':''}<div class="pact"><button class="btn ghost sm" data-act="memDupHide">Back to form</button><button class="btn sm" data-act="memDupForce">Add anyway</button></div></div>`;
  host.insertAdjacentHTML('afterbegin',box);const b=$('#memDupBox');if(b)b.scrollIntoView({block:'nearest'})}
/* ---- History ng member (read-only) ---- */
function mhRows(){const r=MH.q.trim().toLowerCase();let L=AUD.log.filter(e=>e.t==='mh'&&(e.mid===MH.id||(MH.code&&e.rid===MH.code)));
  L=L.filter(e=>{const d=e.ts.slice(0,10);if(MH.from&&d<MH.from)return false;if(MH.to&&d>MH.to)return false;if(r&&!([e.f,e.o,e.n,e.by,e.act].join(' ').toLowerCase().includes(r)))return false;return true});
  L.sort((a,b)=>MH.sort==='old'?a.at-b.at:b.at-a.at);return L}
const mhNA=v=>v===''||v==null?'<i style="color:var(--muted)">N/A</i>':esc(v);
function mhBody(){const L=mhRows();return `<p class="hint" style="margin:6px 0">${L.length} entry · read-only</p><div class="tbl-wrap" style="max-height:52vh;overflow:auto"><table class="tbl"><thead><tr><th>Date &amp; Time</th><th>Member ID</th><th>Field</th><th>Previous value</th><th>New value</th><th>Action</th><th>Updated by</th></tr></thead><tbody>${L.map(e=>`<tr><td style="white-space:nowrap">${esc(e.ts)}</td><td>${esc(e.rid)}</td><td><b>${esc(e.f)}</b></td><td${e.act==='Updated'?' style="background:#fbe9e6;text-decoration:line-through"':''}>${mhNA(e.o)}</td><td${e.act==='Updated'?' style="background:#d9f0e5;font-weight:600"':''}>${mhNA(e.n)}</td><td>${esc(e.act)}</td><td>${e.by?esc(e.by):'Legacy Record'}</td></tr>`).join('')||'<tr><td colspan="7" class="muted">Wala pang naitalang pagbabago. Nagsisimula ang history mula nang ma-install ang feature na ito.</td></tr>'}</tbody></table></div>`}
function mhOpen(id,code,title){MH.id=id||'';MH.code=code||'';MH.q='';MH.from='';MH.to='';MH.sort='new';
  modal('🕘 History — '+esc(title||code||id),`<div class="fgrid"><label class="f"><span>Search</span><input class="in" data-mh="q" placeholder="field, value, user…"></label><label class="f"><span>Mula</span><input class="in" type="date" data-mh="from"></label><label class="f"><span>Hanggang</span><input class="in" type="date" data-mh="to"></label><label class="f"><span>Ayos</span><select class="in" data-mh="sort"><option value="new">Pinakabago muna</option><option value="old">Pinakaluma muna</option></select></label></div><div id="mhBody">${mhBody()}</div>`,`<button class="btn ghost" data-act="mhCsv">Export CSV</button><button class="btn" data-act="closeModal">Close</button>`,true)}
const mhPaint=()=>{const b=$('#mhBody');if(b)b.innerHTML=mhBody()};
document.addEventListener('input',e=>{const d=e.target&&e.target.dataset;if(d&&d.mh){MH[d.mh]=e.target.value;mhPaint()}});document.addEventListener('change',e=>{const d=e.target&&e.target.dataset;if(d&&d.mh){MH[d.mh]=e.target.value;mhPaint()}});
Object.assign(ACT,{
  memHist(el){const m=memberById(el.dataset.id);if(!m)return;mhOpen(m.id,m.code||'',fullName(m)+(m.code?' ('+m.code+')':''))},
  memHistById(){if(!authReqSA('Member history lookup'))return;const c=($('#mhId')||{}).value||'';if(!c.trim()){SFX.err();return toast('Ilagay ang Member ID','bad')}const m=state.members.find(x=>String(x.code||'').toLowerCase()===c.trim().toLowerCase()||x.id===c.trim());mhOpen(m?m.id:'',m?m.code:c.trim(),c.trim()+(m?'':' (wala na sa listahan)'))},
  mhCsv(){const L=mhRows();download('member-history-'+(MH.code||MH.id)+'-'+today()+'.csv','\ufeff'+toCSV([['Date & Time','Member ID','Field','Previous value','New value','Action','Updated by'],...L.map(e=>[e.ts,e.rid,e.f,e.o===''?'N/A':e.o,e.n===''?'N/A':e.n,e.act,e.by||'Legacy Record'])]),'text/csv;charset=utf-8');SFX.success()},
  memDupHide(){const b=$('#memDupBox');if(b)b.remove()},
  memDupForce(){const strong=!!$('#dupAck');if(strong&&!$('#dupAck').checked){SFX.err();return toast('I-check muna ang kumpirmasyon','bad')}const f=$('#modal [data-act=saveMember]');if(!f)return;
    audLog('DUPLICATE OVERRIDE','Member','','Nagdagdag ng member sa kabila ng duplicate warning ('+(strong?'malakas':'posible')+' na tugma)');MEMDUP.ok=true;f.click()}
});

(async()=>{let loaded=null;try{db=await idbOpen();loaded=await idbGet('state')}catch(e){db=null}
  state=loaded?migrate(loaded):defaults();await syLoad();await bkLoad();try{if(db&&(await idbGet('snaps')))await idbSet('snaps',null)}catch(e){}await authBoot();setTimeout(()=>{if(BK.h&&BK.perm==='granted')bkWrite()},6000);
  if(!db){setInd('err','Not saving');toast('⚠️ Hindi ma-access ang storage (Incognito?). Hindi mase-save ang data.','bad')}
  else{if(!loaded){await persist();toast('👋 Welcome! Wala pang data — simulan sa WSA, tapos Members.','good')}try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}}
})();
